server:
  port: 5555

spring:
  data:
    redis:
      host: 192.168.236.200
      port: 6379
      database: 0
      timeout: 3000
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pkqb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 长试卷 PDF 常见超过 8MB，放宽到 50MB；Nginx 侧需同步 client_max_body_size
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    retry:
      max-attempts: 2
    dashscope:
      api-key: ${Spring_ai_alibaba}
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
          # 结构化解析输出（题目+选项+答案解析）远超 1024 tokens，过低会导致 JSON 被截断
          localhost-max-tokens: 8192
          personal-max-tokens:  8192
      vision:
        model: qwen3.6-plus
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      redis:
        initialize-schema: true
        index-name: pkqb_vector_index
        prefix: "pkqb:"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL日志走Slf4j统一管理（StdOutImpl直打控制台有性能损耗且无法按级别关闭）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: pkqb-jwt-secret-key-2026-this-is-a-long-enough-secret-for-hs256
  expiration: 604800000

app:
  api-key:
    encrypt-secret: pkqb-api-key-encrypt-secret-32b

# AI 模型 HTTP 调用超时：避免单次调用无限期挂起，长任务整体卡死
pkqb:
  ai:
    request-timeout:
      connect-seconds: 10
      read-seconds: 180
    parse:
      # 单次解析的规模上限：超过后提示用户拆分，避免一次任务触发数百次模型调用
      max-pdf-pages: 300
      max-text-chunks: 200
    # OpenAI 兼容渠道配置（支持 DeepSeek、Claude 等兼容 API）
    openai:
      # 默认模型
      default-model: gpt-4o-mini
      # 默认视觉模型
      default-vision-model: gpt-4o-mini
      # API 地址（可配置为 DeepSeek、Claude 代理等）
      base-url: https://api.openai.com/v1
      # API Key（可选，优先级低于用户个人 Key）
      api-key: ${PKQB_AI_OPENAI_KEY:}
      # 本地解析最大 tokens
      local-max-tokens: 8192
      # 个人用户解析最大 tokens
      personal-max-tokens: 8192

aliyun-oss:
  endpoint: oss-cn-guangzhou.aliyuncs.com
  access-key-id: ${AccessKey_ID}
  access-key-secret: ${AccessKey_Secret}
  bucket-name: pkqb-oss

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
