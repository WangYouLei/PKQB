server:
  port: 5555

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
  datasource:
    url: jdbc:mysql://localhost:3306/pkqb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 最大文件大小   springboot默认是10mb
      max-file-size: 8MB
      # 最大请求大小
      max-request-size: 8MB
  ai:
    # 重试配置  失败后，再重试一次（所以是2）
    retry:
      max-attempts: 2
    dashscope:
      # 从系统的环境变量中加载api-key
      api-key: ${Spring_ai_alibaba}
      chat:
        options:
          model: tongyi-xiaomi-analysis-pro
          # 模型温度越高，灵活性越高，结果越随机
          temperature: 0.7
          # 系统API输出最大token数（限制较小） 选择范围为：【1,2000】
          # localhost-max-tokens:本地apikey的限制    personal-max-tokens：个人apikey的限制
          localhost-max-tokens: 1024
          personal-max-tokens:  2000
      embedding:
        options:
          model: text-embedding-v4
          # 模型返回的向量的维度大小
          dimensions: 1024
    # Milvus Vector Store 配置
    vectorstore:
      milvus:
        enabled: true  # 启用Milvus配置   这个不是官方设置
        initialize-schema: true  # 启用schema初始化，自动创建集合
        client:
          host: 192.168.236.150  # 服务器地址
          port: 19530
          username: "minioadmin"
          password: "minioadmin"
        databaseName: "default"
        collectionName: "PKQB"
        embeddingDimension: 1024 # 默认是：1536


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: pkqb-jwt-secret-key-2026-this-is-a-long-enough-secret-for-hs256
  # 604800000 = 7 * 24 * 60 * 60 * 1000 过期时间为7天
  expiration: 604800000

app:
  api-key:
    encrypt-secret: ${API_KEY_ENCRYPT_SECRET:pkqb-api-key-encrypt-secret-32b}

minio:
  endpoint: http://192.168.236.150:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: pkqb-files

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
